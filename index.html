<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"="width=device-width, initial-scale=1.0">
    <title>Фото Галерея</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .debug-info {
            background-color: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 12px;
            font-family: monospace;
            color: #333;
            max-height: 150px;
            overflow-y: auto;
        }

        .debug-info.hidden {
            display: none;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: 2px dashed var(--tg-theme-hint-color, #cccccc);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-item:hover {
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .photo-item.filled {
            border: none;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-icon {
            font-size: 48px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .delete-btn:active {
            transform: scale(0.9);
        }

        .upload-input {
            display: none;
        }

        .info-block {
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .info-block p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #666666);
        }

        .counter {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--tg-theme-text-color, #000000);
        }

        .clear-all-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-destructive-text-color, #ff3b30);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.3s ease;
        }

        .clear-all-btn:active {
            opacity: 0.7;
        }

        .clear-all-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #999999);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .photo-item.filled {
            animation: fadeIn 0.3s ease;
        }

        .toggle-debug {
            background: none;
            border: none;
            color: var(--tg-theme-hint-color, #999999);
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 12px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Моя Галерея v1</h1>
            <p>Загрузите до 5 фотографий</p>
        </div>

        <button class="toggle-debug" id="toggleDebug">Показать отладку</button>
        <div class="debug-info hidden" id="debugInfo">
            Инициализация...
        </div>

        <div class="counter" id="counter">
            Загружено: 0 из 5
        </div>

        <div class="photo-grid" id="photoGrid">
            <!-- Фото будут добавляться динамически -->
        </div>

        <div class="info-block">
            <p>💡 Ваши фотографии сохраняются в Telegram Cloud Storage и доступны на всех ваших устройствах</p>
        </div>

        <button class="clear-all-btn" id="clearAllBtn" disabled>
            Удалить все фото
        </button>
    </div>

    <input type="file" id="uploadInput" class="upload-input" accept="image/*" multiple>

    <script>
        // Отладочная информация
        const debugInfo = document.getElementById('debugInfo');
        const toggleDebug = document.getElementById('toggleDebug');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            console.log(logMessage);
            debugInfo.innerHTML += logMessage + '<br>';
            debugInfo.scrollTop = debugInfo.scrollHeight;
        }

        toggleDebug.addEventListener('click', () => {
            debugInfo.classList.toggle('hidden');
            toggleDebug.textContent = debugInfo.classList.contains('hidden') 
                ? 'Показать отладку' 
                : 'Скрыть отладку';
        });

        // Проверка доступности Telegram WebApp
        log('Проверка Telegram WebApp...');
        
        if (typeof window.Telegram === 'undefined' || !window.Telegram.WebApp) {
            log('❌ ОШИБКА: Telegram WebApp недоступен!');
            log('Откройте это приложение через Telegram Mini App');
        } else {
            log('✅ Telegram WebApp загружен');
        }

        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        log(`Версия: ${tg.version || 'неизвестна'}`);
        log(`Платформа: ${tg.platform || 'неизвестна'}`);
        log(`User ID: ${tg.initDataUnsafe?.user?.id || 'неизвестен'}`);

        // Проверка доступности Cloud Storage
        if (typeof tg.CloudStorage === 'undefined') {
            log('❌ ОШИБКА: CloudStorage недоступен!');
            log('Возможно, старая версия Telegram');
        } else {
            log('✅ CloudStorage доступен');
        }

        // Применяем тему Telegram
        document.body.style.backgroundColor = tg.backgroundColor || '#ffffff';

        const MAX_PHOTOS = 5;
        const STORAGE_KEY = 'user_photos';
        let photos = [];

        const photoGrid = document.getElementById('photoGrid');
        const uploadInput = document.getElementById('uploadInput');
        const counter = document.getElementById('counter');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // Загрузка фотографий из Telegram Cloud Storage
        async function loadPhotos() {
            log('Начало загрузки фотографий...');
            
            if (typeof tg.CloudStorage === 'undefined') {
                log('❌ CloudStorage недоступен, используется localStorage');
                // Fallback на localStorage для тестирования
                try {
                    const data = localStorage.getItem(STORAGE_KEY);
                    if (data) {
                        photos = JSON.parse(data);
                        log(`✅ Загружено из localStorage: ${photos.length} фото`);
                    }
                } catch (error) {
                    log(`❌ Ошибка localStorage: ${error.message}`);
                }
                renderPhotos();
                return;
            }

            try {
                const data = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('Timeout: CloudStorage не отвечает'));
                    }, 5000);

                    tg.CloudStorage.getItem(STORAGE_KEY, (error, result) => {
                        clearTimeout(timeout);
                        if (error) {
                            log(`❌ Ошибка CloudStorage.getItem: ${error}`);
                            reject(error);
                        } else {
                            log(`✅ CloudStorage.getItem выполнен`);
                            resolve(result);
                        }
                    });
                });

                if (data) {
                    photos = JSON.parse(data);
                    log(`✅ Загружено фотографий: ${photos.length}`);
                } else {
                    log('ℹ️ Данных в CloudStorage нет (первый запуск)');
                }
            } catch (error) {
                log(`❌ Ошибка загрузки: ${error.message}`);
                photos = [];
            }
            
            renderPhotos();
        }

        // Сохранение фотографий в Telegram Cloud Storage
        async function savePhotos() {
            log('Начало сохранения фотографий...');
            
            if (typeof tg.CloudStorage === 'undefined') {
                log('CloudStorage недоступен, используется localStorage');
                // Fallback на localStorage
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
                    log(`✅ Сохранено в localStorage: ${photos.length} фото`);
                } catch (error) {
                    log(`❌ Ошибка localStorage: ${error.message}`);
                }
                return;
            }

            try {
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('Timeout: CloudStorage не отвечает'));
                    }, 5000);

                    const dataToSave = JSON.stringify(photos);
                    log(`Размер данных: ${(dataToSave.length / 1024).toFixed(2)} KB`);

                    tg.CloudStorage.setItem(STORAGE_KEY, dataToSave, (error, success) => {
                        clearTimeout(timeout);
                        if (error) {
                            log(`❌ Ошибка CloudStorage.setItem: ${error}`);
                            reject(error);
                        } else {
                            log(`✅ CloudStorage.setItem выполнен: ${success}`);
                            resolve(success);
                        }
                    });
                });
                log(`✅ Сохранено фотографий: ${photos.length}`);
            } catch (error) {
                log(`❌ Ошибка сохранения: ${error.message}`);
                tg.showAlert('Ошибка сохранения данных: ' + error.message);
            }
        }

        // Отрисовка фотографий
        function renderPhotos() {
            photoGrid.innerHTML = '';

            // Отображаем существующие фото
            photos.forEach((photo, index) => {
                const photoItem = createPhotoElement(photo, index);
                photoGrid.appendChild(photoItem);
            });

            // Добавляем пустые слоты
            const emptySlots = MAX_PHOTOS - photos.length;
            for (let i = 0; i < emptySlots; i++) {
                const emptySlot = createEmptySlot();
                photoGrid.appendChild(emptySlot);
            }

            updateCounter();
        }

        // Создание элемента фото
        function createPhotoElement(photoData, index) {
            const div = document.createElement('div');
            div.className = 'photo-item filled';
            
            const img = document.createElement('img');
            img.src = photoData;
            img.alt = `Фото ${index + 1}`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deletePhoto(index);
            };
            
            div.appendChild(img);
            div.appendChild(deleteBtn);
            
            return div;
        }

        // Создание пустого слота
        function createEmptySlot() {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.innerHTML = '<div class="add-icon">+</div>';
            div.onclick = () => {
                if (photos.length < MAX_PHOTOS) {
                    log('Открытие диалога выбора файлов...');
                    uploadInput.click();
                } else {
                    tg.showAlert('Достигнут лимит в 5 фотографий');
                }
            };
            return div;
        }

        // Обновление счетчика
        function updateCounter() {
            counter.textContent = `Загружено: ${photos.length} из ${MAX_PHOTOS}`;
            clearAllBtn.disabled = photos.length === 0;
        }

        // Обработка загрузки файлов
        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            log(`Выбрано файлов: ${files.length}`);
            
            const availableSlots = MAX_PHOTOS - photos.length;
            
            if (files.length > availableSlots) {
                tg.showAlert(`Можно загрузить только ${availableSlots} фото`);
                log(`⚠️ Превышен лимит, можно загрузить только ${availableSlots}`);
                return;
            }

            for (const file of files) {
                if (photos.length >= MAX_PHOTOS) break;
                
                if (!file.type.startsWith('image/')) {
                    log(`⚠️ Пропущен не-изображение: ${file.name}`);
                    continue;
                }

                log(`Обработка файла: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);

                try {
                    const base64 = await fileToBase64(file);
                    photos.push(base64);
                    log(`✅ Файл добавлен в массив`);
                } catch (error) {
                    log(`❌ Ошибка конвертации ${file.name}: ${error.message}`);
                }
            }

            await savePhotos();
            renderPhotos();
            uploadInput.value = '';
        });

        // Конвертация файла в Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                // Сначала сжимаем изображение
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Ограничиваем размер изображения
                        const maxSize = 800;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height && width > maxSize) {
                            height = (height * maxSize) / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = (width * maxSize) / height;
                            height = maxSize;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Конвертируем в JPEG с качеством 0.8
                        const compressed = canvas.toDataURL('image/jpeg', 0.8);
                        log(`Сжато: ${(compressed.length / 1024).toFixed(2)} KB`);
                        resolve(compressed);
                    };
                    img.onerror = () => reject(new Error('Ошибка загрузки изображения'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Ошибка чтения файла'));
                reader.readAsDataURL(file);
            });
        }

        // Удаление фото
        async function deletePhoto(index) {
            log(`Запрос удаления фото ${index}`);
            tg.showConfirm('Удалить это фото?', async (confirmed) => {
                if (confirmed) {
                    photos.splice(index, 1);
                    log(`✅ Фото ${index} удалено`);
                    await savePhotos();
                    renderPhotos();
                } else {
                    log('Удаление отменено');
                }
            });
        }

        // Удаление всех фото
        clearAllBtn.addEventListener('click', () => {
            log('Запрос удаления всех фото');
            tg.showConfirm('Удалить все фотографии?', async (confirmed) => {
                if (confirmed) {
                    photos = [];
                    log('✅ Все фото удалены');
                    await savePhotos();
                    renderPhotos();
                } else {
                    log('Удаление отменено');
                }
            });
        });

        // Инициализация при загрузке
        log('Запуск инициализации...');
        loadPhotos();
    </script>
</body>
</html>
