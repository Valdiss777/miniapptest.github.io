<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото Галерея</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: 2px dashed var(--tg-theme-hint-color, #cccccc);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-item:hover {
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .photo-item.filled {
            border: none;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-icon {
            font-size: 48px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .delete-btn:active {
            transform: scale(0.9);
        }

        .upload-input {
            display: none;
        }

        .info-block {
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .info-block p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #666666);
        }

        .counter {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--tg-theme-text-color, #000000);
        }

        .clear-all-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-destructive-text-color, #ff3b30);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.3s ease;
        }

        .clear-all-btn:active {
            opacity: 0.7;
        }

        .clear-all-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #999999);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .photo-item.filled {
            animation: fadeIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Моя Галерея</h1>
            <p>Загрузите до 5 фотографий</p>
        </div>

        <div class="counter" id="counter">
            Загружено: 0 из 5
        </div>

        <div class="photo-grid" id="photoGrid">
            <!-- Фото будут добавляться динамически -->
        </div>

        <div class="info-block">
            <p>💡 Ваши фотографии сохраняются в Telegram Cloud Storage и доступны на всех ваших устройствах</p>
        </div>

        <button class="clear-all-btn" id="clearAllBtn" disabled>
            Удалить все фото
        </button>
    </div>

    <input type="file" id="uploadInput" class="upload-input" accept="image/*" multiple>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Применяем тему Telegram
        document.body.style.backgroundColor = tg.backgroundColor || '#ffffff';

        const MAX_PHOTOS = 5;
        const STORAGE_KEY = 'user_photos';
        let photos = [];

        const photoGrid = document.getElementById('photoGrid');
        const uploadInput = document.getElementById('uploadInput');
        const counter = document.getElementById('counter');
        const clearAllBtn = document.getElementById('clearAllBtn');

        // Загрузка фотографий из Telegram Cloud Storage
        async function loadPhotos() {
            try {
                const data = await new Promise((resolve, reject) => {
                    tg.CloudStorage.getItem(STORAGE_KEY, (error, result) => {
                        if (error) reject(error);
                        else resolve(result);
                    });
                });

                if (data) {
                    photos = JSON.parse(data);
                    console.log('Загружено фотографий:', photos.length);
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                photos = [];
            }
            
            renderPhotos();
        }

        // Сохранение фотографий в Telegram Cloud Storage
        async function savePhotos() {
            try {
                await new Promise((resolve, reject) => {
                    tg.CloudStorage.setItem(STORAGE_KEY, JSON.stringify(photos), (error, success) => {
                        if (error) reject(error);
                        else resolve(success);
                    });
                });
                console.log('Фотографии сохранены');
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                tg.showAlert('Ошибка сохранения данных');
            }
        }

        // Отрисовка фотографий
        function renderPhotos() {
            photoGrid.innerHTML = '';

            // Отображаем существующие фото
            photos.forEach((photo, index) => {
                const photoItem = createPhotoElement(photo, index);
                photoGrid.appendChild(photoItem);
            });

            // Добавляем пустые слоты
            const emptySlots = MAX_PHOTOS - photos.length;
            for (let i = 0; i < emptySlots; i++) {
                const emptySlot = createEmptySlot();
                photoGrid.appendChild(emptySlot);
            }

            updateCounter();
        }

        // Создание элемента фото
        function createPhotoElement(photoData, index) {
            const div = document.createElement('div');
            div.className = 'photo-item filled';
            
            const img = document.createElement('img');
            img.src = photoData;
            img.alt = `Фото ${index + 1}`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deletePhoto(index);
            };
            
            div.appendChild(img);
            div.appendChild(deleteBtn);
            
            return div;
        }

        // Создание пустого слота
        function createEmptySlot() {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.innerHTML = '<div class="add-icon">+</div>';
            div.onclick = () => {
                if (photos.length < MAX_PHOTOS) {
                    uploadInput.click();
                } else {
                    tg.showAlert('Достигнут лимит в 5 фотографий');
                }
            };
            return div;
        }

        // Обновление счетчика
        function updateCounter() {
            counter.textContent = `Загружено: ${photos.length} из ${MAX_PHOTOS}`;
            clearAllBtn.disabled = photos.length === 0;
        }

        // Обработка загрузки файлов
        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            const availableSlots = MAX_PHOTOS - photos.length;
            
            if (files.length > availableSlots) {
                tg.showAlert(`Можно загрузить только ${availableSlots} фото`);
                return;
            }

            for (const file of files) {
                if (photos.length >= MAX_PHOTOS) break;
                
                if (!file.type.startsWith('image/')) {
                    continue;
                }

                try {
                    const base64 = await fileToBase64(file);
                    photos.push(base64);
                } catch (error) {
                    console.error('Ошибка конвертации:', error);
                }
            }

            await savePhotos();
            renderPhotos();
            uploadInput.value = '';
        });

        // Конвертация файла в Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Удаление фото
        async function deletePhoto(index) {
            tg.showConfirm('Удалить это фото?', async (confirmed) => {
                if (confirmed) {
                    photos.splice(index, 1);
                    await savePhotos();
                    renderPhotos();
                }
            });
        }

        // Удаление всех фото
        clearAllBtn.addEventListener('click', () => {
            tg.showConfirm('Удалить все фотографии?', async (confirmed) => {
                if (confirmed) {
                    photos = [];
                    await savePhotos();
                    renderPhotos();
                }
            });
        });

        // Инициализация при загрузке
        loadPhotos();
    </script>
</body>
</html>
