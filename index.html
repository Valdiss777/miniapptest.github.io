<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото Галерея</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 24px;
        }

        .debug-info {
            background: rgba(0, 0, 0, 0.05);
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            margin-bottom: 16px;
            font-family: monospace;
            word-break: break-all;
        }

        .upload-section {
            margin-bottom: 24px;
        }

        .upload-button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-button:active {
            opacity: 0.8;
        }

        .upload-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .delete-button:active {
            background-color: rgba(255, 0, 0, 0.8);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .counter {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error-message {
            background-color: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background-color: rgba(52, 199, 89, 0.1);
            color: #34c759;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Моя Галерея</h1>
        <p class="subtitle">Добавьте до 5 фотографий</p>

        <div class="debug-info" id="debugInfo">Инициализация...</div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <div class="upload-section">
            <button class="upload-button" id="uploadButton">
                <span>➕</span>
                <span>Добавить фото</span>
            </button>
            <input type="file" id="fileInput" accept="image/*" />
            <div class="counter" id="counter">0 / 5 фото</div>
        </div>

        <div id="photosContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🖼️</div>
                <p>Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg;
        try {
            tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        } catch (e) {
            console.error('Telegram WebApp не доступен:', e);
        }

        const MAX_PHOTOS = 5;
        const STORAGE_KEY = 'user_photos';
        let photos = [];
        let storageType = 'none';

        // Элементы DOM
        const uploadButton = document.getElementById('uploadButton');
        const fileInput = document.getElementById('fileInput');
        const photosContainer = document.getElementById('photosContainer');
        const counter = document.getElementById('counter');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const debugInfo = document.getElementById('debugInfo');

        // Обновление отладочной информации
        function updateDebugInfo() {
            const info = [];
            info.push(`Storage: ${storageType}`);
            if (tg) {
                info.push(`TG Version: ${tg.version || 'unknown'}`);
                info.push(`User ID: ${tg.initDataUnsafe?.user?.id || 'unknown'}`);
            }
            info.push(`Photos: ${photos.length}`);
            debugInfo.textContent = info.join(' | ');
        }

        // Работа с хранилищем
        async function loadPhotos() {
            try {
                // Пробуем Cloud Storage
                if (tg && tg.CloudStorage) {
                    storageType = 'CloudStorage';
                    const data = await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            reject(new Error('Timeout'));
                        }, 3000);
                        
                        tg.CloudStorage.getItem(STORAGE_KEY, (error, value) => {
                            clearTimeout(timeout);
                            if (error) reject(error);
                            else resolve(value);
                        });
                    });
                    
                    if (data) {
                        photos = JSON.parse(data);
                    }
                } else {
                    throw new Error('CloudStorage недоступен');
                }
            } catch (error) {
                console.log('CloudStorage недоступен, используем localStorage:', error);
                storageType = 'localStorage';
                
                // Fallback на localStorage
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    photos = JSON.parse(data);
                }
            }
            
            updateDebugInfo();
            renderPhotos();
        }

        async function savePhotos() {
            try {
                const dataToSave = JSON.stringify(photos);
                
                if (storageType === 'CloudStorage' && tg && tg.CloudStorage) {
                    await new Promise((resolve, reject) => {
                        const timeout = setTimeout(() => {
                            reject(new Error('Timeout'));
                        }, 3000);
                        
                        tg.CloudStorage.setItem(STORAGE_KEY, dataToSave, (error, success) => {
                            clearTimeout(timeout);
                            if (error) reject(error);
                            else resolve(success);
                        });
                    });
                } else {
                    // Fallback на localStorage
                    localStorage.setItem(STORAGE_KEY, dataToSave);
                }
                
                return true;
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                
                // Если CloudStorage не сработал, пробуем localStorage
                if (storageType === 'CloudStorage') {
                    try {
                        storageType = 'localStorage';
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(photos));
                        updateDebugInfo();
                        return true;
                    } catch (e) {
                        throw error;
                    }
                }
                throw error;
            }
        }

        // Сжатие изображения
        function compressImage(file, maxWidth = 600, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedBase64);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Отображение фотографий
        function renderPhotos() {
            updateCounter();

            if (photos.length === 0) {
                photosContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🖼️</div>
                        <p>Пока нет фотографий</p>
                        <p style="margin-top: 8px; font-size: 12px;">Нажмите кнопку выше, чтобы добавить</p>
                    </div>
                `;
                return;
            }

            photosContainer.innerHTML = `
                <div class="photos-grid">
                    ${photos.map((photo, index) => `
                        <div class="photo-item">
                            <img src="${photo}" alt="Фото ${index + 1}" />
                            <button class="delete-button" onclick="deletePhoto(${index})">×</button>
                        </div>
                    `).join('')}
                </div>
            `;

            uploadButton.disabled = photos.length >= MAX_PHOTOS;
            if (photos.length >= MAX_PHOTOS) {
                uploadButton.innerHTML = '<span>✓</span><span>Максимум фото добавлено</span>';
            } else {
                uploadButton.innerHTML = '<span>➕</span><span>Добавить фото</span>';
            }
        }

        function updateCounter() {
            counter.textContent = `${photos.length} / ${MAX_PHOTOS} фото`;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.classList.add('show');
            setTimeout(() => {
                successMessage.classList.remove('show');
            }, 2000);
        }

        // Добавление фото
        uploadButton.addEventListener('click', () => {
            if (photos.length < MAX_PHOTOS) {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showError('Пожалуйста, выберите изображение');
                fileInput.value = '';
                return;
            }

            uploadButton.disabled = true;
            uploadButton.innerHTML = '<span>⏳</span><span>Загрузка...</span>';

            try {
                const compressedBase64 = await compressImage(file);
                photos.push(compressedBase64);
                
                await savePhotos();
                
                renderPhotos();
                showSuccess('✓ Фото добавлено!');
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (error) {
                console.error('Ошибка добавления фото:', error);
                showError('Ошибка: ' + error.message);
                photos.pop();
                renderPhotos();
            }

            fileInput.value = '';
        });

        // Удаление фото
        window.deletePhoto = async function(index) {
            photos.splice(index, 1);
            
            try {
                await savePhotos();
                renderPhotos();
                showSuccess('✓ Фото удалено');
                
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
            } catch (error) {
                console.error('Ошибка удаления фото:', error);
                showError('Не удалось удалить фото');
                loadPhotos();
            }
        };

        // Запуск приложения
        loadPhotos();
    </script>
</body>
</html>
