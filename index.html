<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото Галерея</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .subtitle {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 24px;
        }

        .upload-section {
            margin-bottom: 24px;
        }

        .upload-button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .upload-button:active {
            opacity: 0.8;
        }

        .upload-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        input[type="file"] {
            display: none;
        }

        .photos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .delete-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background-color 0.2s;
        }

        .delete-button:active {
            background-color: rgba(255, 0, 0, 0.8);
        }

        .empty-state {
            text-align: center;
            padding: 48px 16px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .loader {
            text-align: center;
            padding: 24px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .counter {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .error-message {
            background-color: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Моя Галерея</h1>
        <p class="subtitle">Добавьте до 5 фотографий</p>

        <div class="error-message" id="errorMessage"></div>

        <div class="upload-section">
            <button class="upload-button" id="uploadButton">
                <span>➕</span>
                <span>Добавить фото</span>
            </button>
            <input type="file" id="fileInput" accept="image/*" />
            <div class="counter" id="counter">0 / 5 фото</div>
        </div>

        <div id="photosContainer">
            <div class="loader">Загрузка...</div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Применяем тему Telegram
        document.body.style.backgroundColor = tg.backgroundColor;

        const MAX_PHOTOS = 5;
        const STORAGE_KEY = 'user_photos';
        let photos = [];

        // Элементы DOM
        const uploadButton = document.getElementById('uploadButton');
        const fileInput = document.getElementById('fileInput');
        const photosContainer = document.getElementById('photosContainer');
        const counter = document.getElementById('counter');
        const errorMessage = document.getElementById('errorMessage');

        // Загрузка фотографий при запуске
        async function loadPhotos() {
            try {
                const data = await getCloudStorage(STORAGE_KEY);
                if (data) {
                    photos = JSON.parse(data);
                } else {
                    photos = [];
                }
                renderPhotos();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                photos = [];
                renderPhotos();
            }
        }

        // Работа с Telegram Cloud Storage
        function getCloudStorage(key) {
            return new Promise((resolve, reject) => {
                tg.CloudStorage.getItem(key, (error, value) => {
                    if (error) {
                        reject(error);
                    } else {
                        resolve(value);
                    }
                });
            });
        }

        function setCloudStorage(key, value) {
            return new Promise((resolve, reject) => {
                tg.CloudStorage.setItem(key, value, (error, success) => {
                    if (error) {
                        reject(error);
                    } else {
                        resolve(success);
                    }
                });
            });
        }

        // Отображение фотографий
        function renderPhotos() {
            updateCounter();

            if (photos.length === 0) {
                photosContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🖼️</div>
                        <p>Пока нет фотографий</p>
                        <p style="margin-top: 8px; font-size: 12px;">Нажмите кнопку выше, чтобы добавить</p>
                    </div>
                `;
                return;
            }

            photosContainer.innerHTML = `
                <div class="photos-grid">
                    ${photos.map((photo, index) => `
                        <div class="photo-item">
                            <img src="${photo}" alt="Фото ${index + 1}" />
                            <button class="delete-button" onclick="deletePhoto(${index})">×</button>
                        </div>
                    `).join('')}
                </div>
            `;

            // Обновляем состояние кнопки загрузки
            uploadButton.disabled = photos.length >= MAX_PHOTOS;
            if (photos.length >= MAX_PHOTOS) {
                uploadButton.innerHTML = '<span>✓</span><span>Максимум фото добавлено</span>';
            } else {
                uploadButton.innerHTML = '<span>➕</span><span>Добавить фото</span>';
            }
        }

        // Обновление счетчика
        function updateCounter() {
            counter.textContent = `${photos.length} / ${MAX_PHOTOS} фото`;
        }

        // Показать ошибку
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }

        // Добавление фото
        uploadButton.addEventListener('click', () => {
            if (photos.length < MAX_PHOTOS) {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Проверка типа файла
            if (!file.type.startsWith('image/')) {
                showError('Пожалуйста, выберите изображение');
                return;
            }

            // Проверка размера (макс. 5MB)
            if (file.size > 5 * 1024 * 1024) {
                showError('Размер файла не должен превышать 5MB');
                return;
            }

            // Конвертация в base64
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const base64 = event.target.result;
                    photos.push(base64);
                    
                    // Сохранение в облако
                    await setCloudStorage(STORAGE_KEY, JSON.stringify(photos));
                    
                    renderPhotos();
                    tg.HapticFeedback.notificationOccurred('success');
                } catch (error) {
                    console.error('Ошибка добавления фото:', error);
                    showError('Не удалось добавить фото');
                    photos.pop(); // Убираем последнее добавленное фото при ошибке
                }
            };
            reader.readAsDataURL(file);
            
            // Очистка input для возможности загрузки того же файла повторно
            fileInput.value = '';
        });

        // Удаление фото
        window.deletePhoto = async function(index) {
            if (confirm('Удалить это фото?')) {
                photos.splice(index, 1);
                
                try {
                    await setCloudStorage(STORAGE_KEY, JSON.stringify(photos));
                    renderPhotos();
                    tg.HapticFeedback.notificationOccurred('success');
                } catch (error) {
                    console.error('Ошибка удаления фото:', error);
                    showError('Не удалось удалить фото');
                    // Восстанавливаем фото при ошибке
                    loadPhotos();
                }
            }
        };

        // Запуск приложения
        loadPhotos();
    </script>
</body>
</html>
