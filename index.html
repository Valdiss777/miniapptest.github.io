<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фото Галерея</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            background-color: #34c759;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .photo-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border: 2px dashed var(--tg-theme-hint-color, #cccccc);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .photo-item:hover {
            border-color: var(--tg-theme-button-color, #3390ec);
        }

        .photo-item.filled {
            border: none;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .add-icon {
            font-size: 48px;
            color: var(--tg-theme-hint-color, #999999);
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(255, 59, 48, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .delete-btn:active {
            transform: scale(0.9);
        }

        .upload-input {
            display: none;
        }

        .info-block {
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .info-block p {
            font-size: 14px;
            line-height: 1.5;
            color: var(--tg-theme-hint-color, #666666);
        }

        .counter {
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--tg-theme-text-color, #000000);
        }

        .clear-all-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-destructive-text-color, #ff3b30);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 16px;
            transition: opacity 0.3s ease;
        }

        .clear-all-btn:active {
            opacity: 0.7;
        }

        .clear-all-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--tg-theme-hint-color, #999999);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .photo-item.filled {
            animation: fadeIn 0.3s ease;
        }

        .user-info {
            text-align: center;
            font-size: 13px;
            color: var(--tg-theme-hint-color, #999999);
            margin-bottom: 20px;
            padding: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f7f7f7);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Моя Галерея v2</h1>
            <p>Загрузите до 5 фотографий</p>
            <div class="status-badge" id="statusBadge">✓ Готово к работе</div>
        </div>

        <div class="user-info" id="userInfo">
            Загрузка информации...
        </div>

        <div class="counter" id="counter">
            Загружено: 0 из 5
        </div>

        <div class="photo-grid" id="photoGrid">
            <!-- Фото будут добавляться динамически -->
        </div>

        <div class="info-block">
            <p>💡 Ваши фотографии сохраняются на устройстве и синхронизируются с вашим Telegram аккаунтом</p>
        </div>

        <button class="clear-all-btn" id="clearAllBtn" disabled>
            Удалить все фото
        </button>
    </div>

    <input type="file" id="uploadInput" class="upload-input" accept="image/*" multiple>

    <script>
        // Инициализация Telegram Web App
        let tg;
        let userId = 'demo_user'; // Fallback для тестирования вне Telegram

        try {
            tg = window.Telegram.WebApp;
            tg.expand();
            tg.ready();
            
            // Получаем ID пользователя
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = tg.initDataUnsafe.user.id.toString();
                console.log('User ID:', userId);
            }
            
            // Применяем тему
            document.body.style.backgroundColor = tg.backgroundColor || '#ffffff';
            
        } catch (error) {
            console.error('Telegram WebApp не инициализирован:', error);
            tg = {
                showAlert: (msg) => alert(msg),
                showConfirm: (msg, callback) => callback(confirm(msg))
            };
        }

        // Показываем информацию о пользователе
        const userInfo = document.getElementById('userInfo');
        if (userId !== 'demo_user') {
            userInfo.textContent = `👤 User ID: ${userId}`;
        } else {
            userInfo.textContent = '⚠️ Демо режим (откройте через Telegram для сохранения данных)';
            userInfo.style.backgroundColor = '#fff3cd';
            userInfo.style.color = '#856404';
        }

        const MAX_PHOTOS = 5;
        const STORAGE_PREFIX = 'tg_photos_';
        let photos = [];

        const photoGrid = document.getElementById('photoGrid');
        const uploadInput = document.getElementById('uploadInput');
        const counter = document.getElementById('counter');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const statusBadge = document.getElementById('statusBadge');

        // Получение ключа хранилища для текущего пользователя
        function getStorageKey() {
            return STORAGE_PREFIX + userId;
        }

        // Загрузка фотографий из localStorage
        function loadPhotos() {
            try {
                const storageKey = getStorageKey();
                const data = localStorage.getItem(storageKey);
                
                if (data) {
                    photos = JSON.parse(data);
                    console.log(`Загружено ${photos.length} фотографий для пользователя ${userId}`);
                    statusBadge.textContent = `✓ Загружено ${photos.length} фото`;
                    statusBadge.style.backgroundColor = '#34c759';
                } else {
                    console.log('Фотографий не найдено (первый запуск)');
                    photos = [];
                }
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                photos = [];
                statusBadge.textContent = '⚠ Ошибка загрузки';
                statusBadge.style.backgroundColor = '#ff9500';
            }
            
            renderPhotos();
        }

        // Сохранение фотографий в localStorage
        function savePhotos() {
            try {
                const storageKey = getStorageKey();
                const data = JSON.stringify(photos);
                
                // Проверяем размер данных (localStorage имеет лимит ~5-10 MB)
                const sizeKB = (data.length / 1024).toFixed(2);
                console.log(`Размер данных: ${sizeKB} KB`);
                
                if (data.length > 5 * 1024 * 1024) {
                    throw new Error('Данные слишком большие (лимит 5 MB)');
                }
                
                localStorage.setItem(storageKey, data);
                console.log(`Сохранено ${photos.length} фотографий для пользователя ${userId}`);
                
                statusBadge.textContent = '✓ Сохранено';
                statusBadge.style.backgroundColor = '#34c759';
                
                setTimeout(() => {
                    statusBadge.textContent = `✓ ${photos.length} фото`;
                }, 2000);
                
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                statusBadge.textContent = '✗ Ошибка сохранения';
                statusBadge.style.backgroundColor = '#ff3b30';
                
                if (error.name === 'QuotaExceededError') {
                    tg.showAlert('Превышен лимит хранилища. Удалите несколько фото.');
                } else {
                    tg.showAlert('Ошибка сохранения: ' + error.message);
                }
            }
        }

        // Отрисовка фотографий
        function renderPhotos() {
            photoGrid.innerHTML = '';

            // Отображаем существующие фото
            photos.forEach((photo, index) => {
                const photoItem = createPhotoElement(photo, index);
                photoGrid.appendChild(photoItem);
            });

            // Добавляем пустые слоты
            const emptySlots = MAX_PHOTOS - photos.length;
            for (let i = 0; i < emptySlots; i++) {
                const emptySlot = createEmptySlot();
                photoGrid.appendChild(emptySlot);
            }

            updateCounter();
        }

        // Создание элемента фото
        function createPhotoElement(photoData, index) {
            const div = document.createElement('div');
            div.className = 'photo-item filled';
            
            const img = document.createElement('img');
            img.src = photoData;
            img.alt = `Фото ${index + 1}`;
            
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '×';
            deleteBtn.onclick = (e) => {
                e.stopPropagation();
                deletePhoto(index);
            };
            
            div.appendChild(img);
            div.appendChild(deleteBtn);
            
            return div;
        }

        // Создание пустого слота
        function createEmptySlot() {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.innerHTML = '<div class="add-icon">+</div>';
            div.onclick = () => {
                if (photos.length < MAX_PHOTOS) {
                    uploadInput.click();
                } else {
                    tg.showAlert('Достигнут лимит в 5 фотографий');
                }
            };
            return div;
        }

        // Обновление счетчика
        function updateCounter() {
            counter.textContent = `Загружено: ${photos.length} из ${MAX_PHOTOS}`;
            clearAllBtn.disabled = photos.length === 0;
        }

        // Обработка загрузки файлов
        uploadInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            console.log(`Выбрано файлов: ${files.length}`);
            
            const availableSlots = MAX_PHOTOS - photos.length;
            
            if (files.length > availableSlots) {
                tg.showAlert(`Можно загрузить только ${availableSlots} фото`);
                return;
            }

            statusBadge.textContent = '⏳ Загрузка...';
            statusBadge.style.backgroundColor = '#007aff';

            for (const file of files) {
                if (photos.length >= MAX_PHOTOS) break;
                
                if (!file.type.startsWith('image/')) {
                    console.log(`Пропущен файл: ${file.name} (не изображение)`);
                    continue;
                }

                console.log(`Обработка: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`);

                try {
                    const base64 = await fileToBase64(file);
                    photos.push(base64);
                    console.log(`Добавлено фото ${photos.length}`);
                } catch (error) {
                    console.error(`Ошибка обработки ${file.name}:`, error);
                }
            }

            savePhotos();
            renderPhotos();
            uploadInput.value = '';
        });

        // Конвертация файла в Base64 с сжатием
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Ограничиваем размер для экономии места
                        const maxSize = 600;
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height && width > maxSize) {
                            height = (height * maxSize) / width;
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = (width * maxSize) / height;
                            height = maxSize;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // Конвертируем в JPEG с качеством 0.7 для экономии места
                        const compressed = canvas.toDataURL('image/jpeg', 0.7);
                        const sizeKB = (compressed.length / 1024).toFixed(2);
                        console.log(`Сжато до: ${sizeKB} KB`);
                        resolve(compressed);
                    };
                    img.onerror = () => reject(new Error('Ошибка загрузки изображения'));
                    img.src = e.target.result;
                };
                reader.onerror = () => reject(new Error('Ошибка чтения файла'));
                reader.readAsDataURL(file);
            });
        }

        // Удаление фото
        function deletePhoto(index) {
            tg.showConfirm('Удалить это фото?', (confirmed) => {
                if (confirmed) {
                    photos.splice(index, 1);
                    console.log(`Удалено фото ${index}`);
                    savePhotos();
                    renderPhotos();
                }
            });
        }

        // Удаление всех фото
        clearAllBtn.addEventListener('click', () => {
            tg.showConfirm('Удалить все фотографии?', (confirmed) => {
                if (confirmed) {
                    photos = [];
                    console.log('Все фото удалены');
                    savePhotos();
                    renderPhotos();
                }
            });
        });

        // Инициализация при загрузке
        console.log('Инициализация приложения...');
        console.log('User ID:', userId);
        loadPhotos();
    </script>
</body>
</html>
